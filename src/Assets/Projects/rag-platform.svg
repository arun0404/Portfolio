<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1330"/>
      <stop offset="1" stop-color="#0c0513"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#bg1)"/>
  <circle cx="200" cy="112" r="140" fill="url(#glow1)"/>

  <!-- stacked documents feeding in -->
  <g>
    <rect x="60" y="96" width="66" height="84" rx="8" fill="#2a2038" stroke="#4a3766" stroke-width="2"/>
    <rect x="72" y="84" width="66" height="84" rx="8" fill="url(#card1)"/>
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round">
      <path d="M86 104 h38 M86 118 h38 M86 132 h26"/>
    </g>
  </g>

  <!-- arrow into vector cloud -->
  <path d="M150 128 H196" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <path d="M188 120 L198 128 L188 136" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- embedding / vector node cluster -->
  <g stroke="#c770f0" stroke-width="2" opacity="0.65">
    <path d="M244 96 L286 78 M244 96 L292 118 M244 96 L270 150
             M286 78 L292 118 M292 118 L270 150 M286 78 L330 100
             M292 118 L330 100 M292 118 L326 148 M270 150 L326 148"/>
  </g>
  <g fill="#0c0513" stroke="#c770f0" stroke-width="3">
    <circle cx="244" cy="96" r="10"/><circle cx="270" cy="150" r="10"/>
  </g>
  <g fill="#c770f0">
    <circle cx="286" cy="78" r="11"/><circle cx="292" cy="118" r="11"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="330" cy="100" r="9"/><circle cx="326" cy="148" r="9"/>
  </g>

  <!-- offline / air-gapped badge -->
  <g transform="translate(300 190)">
    <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#0c0513" stroke="#3d2a52" stroke-width="1.5"/>
    <path d="M-30 -2 a10 10 0 0 1 20 0" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="4" r="2.6" fill="#22d3ee"/>
    <line x1="-34" y1="-10" x2="-6" y2="12" stroke="#f0a3a3" stroke-width="2.4" stroke-linecap="round"/>
    <text x="4" y="6" fill="#e8e2f0" font-family="Verdana, sans-serif" font-size="12" font-weight="bold">OFFLINE RAG</text>
  </g>

  <text x="30" y="40" fill="#e8e2f0" font-family="Georgia, serif" font-size="20" font-weight="bold">Offline RAG Platform</text>
</svg>
