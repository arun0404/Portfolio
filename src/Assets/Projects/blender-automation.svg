<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1330"/>
      <stop offset="1" stop-color="#0c0513"/>
    </linearGradient>
    <radialGradient id="glow4" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#bg4)"/>
  <circle cx="200" cy="112" r="140" fill="url(#glow4)"/>

  <text x="30" y="40" fill="#e8e2f0" font-family="Georgia, serif" font-size="18" font-weight="bold">3D-to-2D Doc Automation</text>

  <!-- exploded 3D cube (isometric) -->
  <g transform="translate(115 128)" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M0 -20 L38 -2 L38 34 L0 52 L-38 34 L-38 -2 Z" opacity="0.55"/>
    <path d="M0 -44 L34 -28 L0 -12 L-34 -28 Z" fill="#a855f7" fill-opacity="0.85" stroke="none"/>
    <path d="M0 -12 L34 -28 L34 6 L0 22 Z" fill="#7c3aed" fill-opacity="0.85" stroke="none"/>
    <path d="M0 -12 L-34 -28 L-34 6 L0 22 Z" fill="#8b5cf6" fill-opacity="0.85" stroke="none"/>
    <path d="M0 -44 L0 -12 M-34 -28 L-34 6 M34 -28 L34 6" stroke="#0c0513" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- arrow -->
  <path d="M186 130 H232" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <path d="M224 122 L234 130 L224 138" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2D SVG line-art with callouts -->
  <g transform="translate(300 128)">
    <rect x="-52" y="-56" width="104" height="112" rx="8" fill="#1a1425" stroke="#3d2a52" stroke-width="1.5"/>
    <g stroke="#e8e2f0" stroke-width="2.4" fill="none">
      <rect x="-30" y="-34" width="36" height="24"/>
      <path d="M-30 -10 h36 v20 h-36 Z"/>
      <line x1="-12" y1="-34" x2="-12" y2="30"/>
    </g>
    <g stroke="#c770f0" stroke-width="1.6">
      <line x1="6" y1="-22" x2="46" y2="-40"/>
      <line x1="6" y1="8" x2="46" y2="18"/>
    </g>
    <g fill="#c770f0">
      <circle cx="6" cy="-22" r="3"/><circle cx="6" cy="8" r="3"/>
    </g>
  </g>

  <!-- reduction badge -->
  <g transform="translate(120 214)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0c0513" stroke="#3d2a52" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#e8e2f0" font-family="Verdana, sans-serif" font-size="13" font-weight="bold">-70% manual time</text>
  </g>
</svg>
