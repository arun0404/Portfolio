<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1330"/>
      <stop offset="1" stop-color="#0c0513"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#c770f0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c770f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#bg5)"/>
  <circle cx="200" cy="120" r="140" fill="url(#glow5)"/>

  <text x="30" y="40" fill="#e8e2f0" font-family="Georgia, serif" font-size="17" font-weight="bold">LLM Fine-Tuning &amp; Agents</text>

  <!-- agent node graph -->
  <g stroke="#c770f0" stroke-width="2.2" opacity="0.6">
    <path d="M200 84 L120 128 M200 84 L280 128 M120 128 L120 176 M280 128 L280 176
             M120 176 L200 208 M280 176 L200 208 M200 84 L200 130"/>
  </g>
  <defs>
    <linearGradient id="card5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="84" r="20" fill="url(#card5)"/>
  <text x="200" y="89" text-anchor="middle" fill="#fff" font-family="Verdana, sans-serif" font-size="11" font-weight="bold">LLM</text>

  <g fill="#1a1425" stroke="#22d3ee" stroke-width="2.5">
    <circle cx="120" cy="128" r="16"/>
    <circle cx="280" cy="128" r="16"/>
    <circle cx="120" cy="176" r="16"/>
    <circle cx="280" cy="176" r="16"/>
  </g>
  <g fill="#cfe9f2" font-family="Verdana, sans-serif" font-size="8" text-anchor="middle">
    <text x="120" y="131">ing</text>
    <text x="280" y="131">ret</text>
    <text x="120" y="179">rsn</text>
    <text x="280" y="179">gen</text>
  </g>

  <circle cx="200" cy="208" r="14" fill="#0c0513" stroke="#c770f0" stroke-width="2.5"/>

  <!-- LoRA slider dial -->
  <g transform="translate(316 68)">
    <rect x="-46" y="-24" width="92" height="48" rx="10" fill="#1a1425" stroke="#3d2a52" stroke-width="1.5"/>
    <text x="0" y="-6" text-anchor="middle" fill="#cfc7db" font-family="Verdana, sans-serif" font-size="10">LoRA / PEFT</text>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#4a3766" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="10" x2="12" y2="10" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="10" r="5" fill="#22d3ee"/>
  </g>

  <!-- accuracy badge -->
  <g transform="translate(90 226)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#0c0513" stroke="#3d2a52" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#e8e2f0" font-family="Verdana, sans-serif" font-size="13" font-weight="bold">+12% accuracy</text>
  </g>
</svg>
