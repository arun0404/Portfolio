<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1330"/>
      <stop offset="1" stop-color="#0c0513"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#c770f0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c770f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#bg2)"/>
  <circle cx="200" cy="112" r="140" fill="url(#glow2)"/>

  <text x="30" y="40" fill="#e8e2f0" font-family="Georgia, serif" font-size="20" font-weight="bold">Offline TTS Engine</text>

  <!-- text lines with a highlighted word -->
  <g>
    <rect x="52" y="76" width="230" height="70" rx="10" fill="#1a1425" stroke="#3d2a52" stroke-width="1.5"/>
    <g stroke="#7a6f8c" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M68 96 h140"/>
      <path d="M68 132 h120"/>
    </g>
    <rect x="152" y="86" width="46" height="18" rx="4" fill="#22d3ee" opacity="0.85"/>
    <g stroke="#0c0513" stroke-width="3" stroke-linecap="round">
      <path d="M160 95 h30"/>
    </g>
  </g>

  <!-- speaker + waveform -->
  <g transform="translate(320 108)">
    <path d="M-20 -14 L-2 -14 L14 -30 V30 L-2 14 H-20 Z" fill="url(#card2)"/>
    <path d="M22 -22 a34 34 0 0 1 0 44" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M10 -10 a16 16 0 0 1 0 20" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- word-level waveform strip -->
  <g stroke="#c770f0" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="200" x2="60" y2="182"/>
    <line x1="76" y1="200" x2="76" y2="164"/>
    <line x1="92" y1="200" x2="92" y2="190"/>
    <line x1="108" y1="200" x2="108" y2="172"/>
    <line x1="124" y1="200" x2="124" y2="150"/>
    <line x1="140" y1="200" x2="140" y2="178"/>
    <line x1="156" y1="200" x2="156" y2="192"/>
    <line x1="172" y1="200" x2="172" y2="160"/>
    <line x1="188" y1="200" x2="188" y2="180"/>
  </g>
  <rect x="100" y="146" width="32" height="58" rx="6" fill="#22d3ee" opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- offline badge -->
  <g transform="translate(310 208)">
    <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#0c0513" stroke="#3d2a52" stroke-width="1.5"/>
    <path d="M-30 -2 a10 10 0 0 1 20 0" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="4" r="2.6" fill="#22d3ee"/>
    <line x1="-34" y1="-10" x2="-6" y2="12" stroke="#f0a3a3" stroke-width="2.4" stroke-linecap="round"/>
    <text x="4" y="6" fill="#e8e2f0" font-family="Verdana, sans-serif" font-size="12" font-weight="bold">WORD-SYNCED</text>
  </g>
</svg>
